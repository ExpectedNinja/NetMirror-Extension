name: Build universal addon image

concurrency:
  group: "addon"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'addon/**'
      - '.github/workflows/addon.yml'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate addon
        run: |
          cd addon
          node --check src/core.js
          node --check src/server.js
          npm test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./addon
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/netmirror-addon:latest
            ghcr.io/${{ github.repository_owner }}/netmirror-addon:${{ github.sha }}
